<style>
:root{--ink:#fff;--sub:rgba(255,255,255,.78);--glass:rgba(255,255,255,.16);--glass2:rgba(255,255,255,.12);--stroke:rgba(255,255,255,.32);--warn:#ffc2bd;--warnbg:rgba(198,40,40,.4);--track:rgba(255,255,255,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#2b6fd0;color:var(--ink);font:17px/1.3 -apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans HK","Microsoft JhengHei",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 15% 8%,rgba(255,255,255,.38),transparent 40%),radial-gradient(circle at 88% 28%,rgba(255,214,102,.38),transparent 36%),linear-gradient(160deg,#4facfe,#5b7cf0 55%,#8a5cd6)}
body.night::before{background:radial-gradient(circle at 20% 8%,rgba(120,160,255,.28),transparent 40%),radial-gradient(circle at 88% 35%,rgba(180,120,255,.24),transparent 36%),linear-gradient(160deg,#0b1220,#16293f 55%,#2a3a63)}
.wrap{max-width:560px;margin:0 auto;padding:10px 12px}
header{display:flex;justify-content:space-between;align-items:center;padding:4px 2px}
h1{font-size:23px;margin:0;text-shadow:0 2px 10px rgba(0,0,0,.25)}
button{font:inherit;color:#fff;border:1px solid var(--stroke);border-radius:14px;background:rgba(255,255,255,.24);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:8px 14px;min-height:44px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
button:active{background:rgba(255,255,255,.38)}
button:disabled{opacity:.6}
.card{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--stroke);border-radius:22px;padding:13px 15px;margin:10px 0;box-shadow:0 8px 32px rgba(10,30,80,.25),inset 0 1px 0 rgba(255,255,255,.38)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.card{background:rgba(35,70,140,.6)}}
.hero{display:flex;align-items:center;justify-content:space-between}
.temp{font-size:68px;font-weight:700;line-height:1;text-shadow:0 3px 14px rgba(0,0,0,.22)}
.temp small{font-size:30px}
.ico{display:grid;place-items:center;flex:none;padding:5px;border-radius:20px;background:linear-gradient(145deg,rgba(96,165,255,.68),rgba(140,96,230,.74));border:1px solid rgba(255,255,255,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 14px rgba(40,30,120,.32)}
.ico[hidden]{display:none}
.ico svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 3px rgba(20,20,80,.35))}
.hero .ico{width:84px;height:84px}
.dt .ico{width:48px;height:48px;border-radius:15px;padding:3px}
.row{display:flex;gap:8px;align-items:center;margin:8px 0 4px}
select{font:inherit;font-size:19px;flex:1;min-width:0;min-height:46px;padding:6px 12px;border-radius:14px;border:1px solid var(--stroke);background:rgba(255,255,255,.18);color:#fff}
select option{color:#14243a}
#near{white-space:nowrap;min-height:46px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.stat{background:var(--glass2);border:1px solid rgba(255,255,255,.22);border-radius:16px;padding:8px 12px}
.stat b{display:block;font-size:25px;line-height:1.2}
.stat span{color:var(--sub);font-size:14px}
.aq{display:flex;align-items:center;gap:12px;margin-top:8px;padding:8px 12px;border-radius:16px;border:1px solid rgba(255,255,255,.3);background:var(--glass2)}
.aq[hidden]{display:none}
.aqn{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:800;box-shadow:0 0 0 3px rgba(255,255,255,.4),0 4px 12px rgba(0,0,0,.28)}
.aqt{min-width:0}
.aqt small{display:block;font-size:13px;color:var(--sub);line-height:1.3}
.aqt b{display:block;font-size:19px;line-height:1.25}
.banner{border-radius:20px;padding:12px 14px;margin:8px 0;font-weight:800;font-size:22px;line-height:1.2;display:flex;gap:12px;align-items:center;border:1px solid rgba(255,255,255,.4);box-shadow:0 6px 20px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.45)}
.banner .ic{font-size:28px;line-height:1;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.3);display:grid;place-items:center;flex:none}
.banner small{display:block;font-size:13px;font-weight:500;opacity:.92;margin-top:2px}
.banner.sev{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.015);box-shadow:0 0 0 6px rgba(255,80,80,.3)}}
@media(prefers-reduced-motion:reduce){.banner.sev{animation:none}}
.ok{display:inline-block;color:var(--ink);font-size:15px;margin:6px 0 2px;padding:3px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--stroke)}
h2{font-size:19px;margin:0 0 6px;line-height:1.25}
.sub{color:var(--sub);font-size:15px}
.priv{color:var(--sub);font-size:12.5px;line-height:1.3}
.ext{display:flex;gap:8px;margin:0 0 4px;font-size:15px;font-weight:700}
.ext span{flex:1;border-radius:14px;padding:6px 10px;background:var(--glass2);border:1px solid rgba(255,255,255,.22)}
.ext .c{color:#c4e3ff}.ext .h{color:#ffd9c2}
.legend{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sub);margin:4px 0 2px}
.legend i{flex:1;height:8px;border-radius:4px;background:linear-gradient(90deg,hsl(220,90%,58%),hsl(176,85%,50%),hsl(132,80%,48%),hsl(88,85%,50%),hsl(44,95%,55%),hsl(0,90%,58%))}
.day{padding:8px 0;border-top:1px solid rgba(255,255,255,.18)}
.day:first-of-type{border-top:0}
.dt{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center}
.d1{font-weight:700;line-height:1.25}
.d2{font-size:14px;color:var(--sub);line-height:1.25}
.tr{font-size:21px;font-weight:700;text-align:right;white-space:nowrap;line-height:1.2}
.tr small{display:block;font-size:12.5px;font-weight:400;color:var(--sub)}
.bar{position:relative;height:12px;border-radius:6px;background:var(--track);margin:7px 0 0 58px;box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}
.bar i{position:absolute;top:0;bottom:0;border-radius:6px;min-width:10px;box-shadow:0 0 8px rgba(255,255,255,.4),inset 0 1px 0 rgba(255,255,255,.45)}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:8px;padding:0 6px;margin-left:6px;color:#fff;vertical-align:middle;border:1px solid rgba(255,255,255,.4)}
.badge.c{background:rgba(30,127,216,.85)}.badge.h{background:rgba(230,74,25,.85)}
.err{background:var(--warnbg);color:#fff;border:1px solid var(--stroke);padding:8px 12px;border-radius:14px;display:none;margin:6px 0;font-size:15px}
footer{text-align:center;color:var(--sub);font-size:13px;line-height:1.4;padding:10px 8px 24px}
footer a{color:#fff}
#install{display:none;width:100%;margin-top:8px}
p{margin:4px 0;line-height:1.4}
</style>

function hav(a,b,c,d){const R=6371,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b);
  const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function nearestStation(lat,lon,enNames){let best=-1,bd=1e9;
  enNames.forEach((n,i)=>{const p=COORD[n];if(!p)return;const d=hav(lat,lon,p[0],p[1]);if(d<bd){bd=d;best=i}});
  return best<0?null:{idx:best,km:bd}}
function nearestAq(lat,lon,have){let best=null,bd=1e9;
  AQ_ST.forEach(s=>{if(have&&!have.includes(s.n))return;const d=hav(lat,lon,s.p[0],s.p[1]);if(d<bd){bd=d;best=s}});
  return best?{st:best,km:bd}:null}
function aqVal(v){if(typeof v==='string'){return v.indexOf('+')>=0?11:parseInt(v,10)}return Number(v)}
function aqLevel(v){
  if(!(v>=1))return null;
  if(v<=3)return{zh:'低',bg:'#2e9d4f',fg:'#fff'};
  if(v<=6)return{zh:'中',bg:'#f2c200',fg:'#3a2f00'};
  if(v===7)return{zh:'高',bg:'#f57c00',fg:'#fff'};
  if(v<=10)return{zh:'甚高',bg:'#d32f2f',fg:'#fff'};
  return{zh:'嚴重',bg:'#222222',fg:'#fff'}}
function warnStyle(key,code){
  const S=(bg,fg,ic,rank)=>({bg,fg,ic,rank});
  if(key==='WRAIN'){
    if(code==='WRAINB')return S('#111','#fff','⬛☔',80);
    if(code==='WRAINR')return S('#d32f2f','#fff','🟥☔',60);
    return S('#ffd600','#3a2f00','🟨☔',40)}
  if(key==='WTCSGNL'){
    if(code==='TC10')return S('#000','#fff','🌀',100);
    if(code==='TC9')return S('#8e0000','#fff','🌀',95);
    if(/^TC8/.test(code))return S('#c62828','#fff','🌀',90);
    if(code==='TC3')return S('#ef6c00','#fff','🌀',50);
    return S('#546e7a','#fff','🌀',30)}
  if(key==='WCOLD')return S('#1565c0','#fff','🥶',45);
  if(key==='WHOT')return S('#e64a19','#fff','🥵',45);
  if(key==='WMSGNL')return S('#00838f','#fff','🌬️',35);
  if(key==='WFIRE'||key==='WFIREY'||key==='WFIRER')return code==='WFIRER'||key==='WFIRER'?S('#c62828','#fff','🔥',55):S('#fbc02d','#3a2f00','🔥',30);
  if(key==='WL')return S('#6d4c41','#fff','⛰️',40);
  if(key==='WTS')return S('#6a1b9a','#fff','⛈️',35);
  if(key==='WFNTSA')return S('#00695c','#fff','🌊',35);
  if(key==='WTMW')return S('#b71c1c','#fff','🌊',70);
  return S('#455a64','#fff','⚠️',20)}
function tempHue(t,lo,hi){const f=(t-lo)/Math.max(1,hi-lo);return Math.round(220*(1-Math.max(0,Math.min(1,f))))}
function rangeBars(days){
  const mins=days.map(d=>+d.forecastMintemp.value),maxs=days.map(d=>+d.forecastMaxtemp.value);
  const lo=Math.min(...mins),hi=Math.max(...maxs),span=Math.max(1,hi-lo);
  return{lo,hi,coldIdx:mins.indexOf(lo),hotIdx:maxs.indexOf(hi),
    bars:days.map((d,i)=>({l:(mins[i]-lo)/span*100,w:(maxs[i]-mins[i])/span*100,c1:tempHue(mins[i],lo,hi),c2:tempHue(maxs[i],lo,hi)}))}}
const ICs={
  cloud:(x,y,s,d)=>'<g transform="translate('+x+' '+y+') scale('+s+')" fill="url(#'+(d?'gCloudD':'gCloud')+')"><circle cx="18" cy="26" r="10"/><circle cx="30" cy="20" r="13"/><circle cx="43" cy="27" r="9"/><rect x="8" y="26" width="44" height="11" rx="5.5"/></g>',

};

  else if(n===64)b=I.cloud(2,-8,1,true)+I.drops([[19,36,9],[28,36,9],[37,36,9],[46,36,9],[23,48,9],[32,48,9],[41,48,9]],3.6);
  else if(n===65)b=I.cloud(2,-8,1,true)+'<polygon points="35,27 24,46 31,46 27,60 43,39 35,39 39,27" fill="url(#gBolt)"/>'+I.drops([[17,40],[50,40]]);
  else if(n>=70&&n<=75)b=I.moon(28,34,1.35)+I.stars([[48,14],[54,28,1.3],[40,8,1.2]]);
  else if(n===76)b=I.moon(24,22,.95)+I.cloud(-6,12,1.2);
  else if(n===77)b=I.moon(24,24,1)+I.cloud(12,24,.8)+I.stars([[50,14,1.4]]);
  else if(n===80)b='<g stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none"><path d="M10 24h30a7 7 0 1 0-7-7"/><path d="M8 36h40a8 8 0 1 1-8 8"/><path d="M14 48h22"/></g>';
  else if(n===81)b='<path d="M32 10C32 10 18 28 18 38a14 14 0 0 0 28 0C46 28 32 10 32 10z" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/><path d="M13 13L51 53" stroke="#ffb74d" stroke-width="4.5" stroke-linecap="round"/>';
  else if(n===82)b='<path d="M32 8C32 8 16 28 16 40a16 16 0 0 0 32 0C48 28 32 8 32 8z" fill="url(#gDrop)"/><path d="M24 40a8 8 0 0 0 6 8" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none" opacity=".8"/>'+I.drops([[52,14,5],[12,18,5]],2.6);
  else if(n===83)b=I.cloud(2,-4,1,true)+I.lines([[10,41,44],[16,48,38],[10,55,30]]);
  else if(n===84)b=I.lines([[10,20,40],[16,30,38],[8,40,42],[18,50,28]],'#fff',3.6);
  else if(n===85)b=I.sun(32,24,10)+I.lines([[8,44,48],[14,51,40],[8,58,34]],'#ffcc80',3.2);
  else if(n===90)b=I.thermo('#ff5252',16)+I.sun(50,16,6);
  else if(n===91)b=I.thermo('#ffa726',28)+I.sun(50,16,6);
  else if(n===92)b=I.thermo('#4fc3f7',34);
  else if(n===93)b=I.thermo('#4aa3ff',38)+'<g stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M50 8v16M42 16h16M44 10l12 12M56 10L44 22"/></g>';
  else b=I.cloud(-4,12,1.2);

const API='https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=';
const AQ_URL='https://dashboard.data.gov.hk/api/aqhi-individual?format=json';
const $=id=>document.getElementById(id);
const KEY_ST='wx_station',KEY_DATA='wx_cache3',REFRESH=10*60*1000;
let state={cur:null,flw:null,fnd:null,warn:null,enT:[],aq:null},lastOk=0,loading=false;
let userPos=null,nearKm=null;

async function getJ(url){
  const c=new AbortController(),to=setTimeout(()=>c.abort(),15000);
  try{const r=await fetch(url,{signal:c.signal});
    if(!r.ok)throw new Error('HTTP '+r.status);return await r.json();}
  finally{clearTimeout(to)}
}
const get=(t,lang)=>getJ(API+t+'&lang='+(lang||'tc')+'&_='+Math.floor(Date.now()/60000));
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

async function load(){
  if(loading)return;loading=true;$('refresh').textContent='… 更新中';
  const res=await Promise.allSettled([get('rhrread'),get('flw'),get('fnd'),get('warnsum'),get('rhrread','en'),getJ(AQ_URL)]);
  let fails=0;
  ['cur','flw','fnd','warn'].forEach((k,i)=>{if(res[i].status==='fulfilled')state[k]=res[i].value;else fails++});
  if(res[4].status==='fulfilled'){const e=res[4].value;
    state.enT=((e.temperature&&e.temperature.data)||[]).map(x=>x.place)}
  if(res[5].status==='fulfilled'&&Array.isArray(res[5].value))state.aq=res[5].value;
  if(fails<4){lastOk=Date.now();try{localStorage.setItem(KEY_DATA,JSON.stringify({state,lastOk}))}catch(e){}}
  const e=$('err');
  if(fails){e.style.display='block';e.textContent=fails===4?'連唔到天文台，顯示上次資料。':'部分資料更新失敗，已顯示可用資料。'}
  else e.style.display='none';
  render();loading=false;$('refresh').textContent='↻ 更新';
}

function fmtTime(s){if(!s)return'';const d=new Date(s);if(isNaN(d))return'';
  return d.toLocaleString('zh-HK',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Hong_Kong'})}

function selectedStation(){
  const temps=(state.cur&&state.cur.temperature&&state.cur.temperature.data)||[];
  const names=temps.map(x=>x.place);
  const saved=localStorage.getItem(KEY_ST)||'香港天文台';
  const cur=names.includes(saved)?saved:(names.includes('香港天文台')?'香港天文台':names[0]);
  return{temps,names,cur,idx:names.indexOf(cur)}
}

function render(){
  const hr=+new Intl.DateTimeFormat('en-GB',{hour:'2-digit',hour12:false,timeZone:'Asia/Hong_Kong'}).format(new Date());
  document.body.classList.toggle('night',hr<6||hr>=18);
  const c=state.cur;
  if(c){
    const S=selectedStation(),sel=$('station');
    if(sel.options.length!==S.names.length||S.names.some((n,i)=>sel.options[i].value!==n)){
      sel.innerHTML=S.names.map(n=>'<option value="'+esc(n)+'">'+esc(n)+'</option>').join('');
    }
    sel.value=S.cur;
    const row=S.temps[S.idx];
    $('t').textContent=row?row.value:'--';
    $('place').textContent=S.cur+'．現時氣溫';
    $('dist').textContent=nearKm!=null?'📍 距離你約 '+(nearKm<1?Math.round(nearKm*1000)+' 米':nearKm.toFixed(1)+' 公里'):'';
    const hd=(c.humidity&&c.humidity.data)||[];
    const h=hd.find(x=>x.place===S.cur)||hd[0];
    $('rh').textContent=h?h.value+'%':'--';
    const uvd=c.uvindex&&c.uvindex.data;
    $('uv').textContent=uvd&&uvd.length?uvd[0].value+'（'+uvd[0].desc+'）':'夜間／未有';
    const ic=c.icon&&c.icon[0];
    if(ic){$('icon').innerHTML=wxIcon(ic);$('icon').hidden=false}
    $('upd').textContent='氣溫記錄：'+fmtTime(c.temperature&&c.temperature.recordTime)+'　更新：'+fmtTime(lastOk?new Date(lastOk).toISOString():c.updateTime);
  }
  renderWarn();renderAq();
  const f=state.flw;
  if(f){
    $('fper').textContent=(f.forecastPeriod||'')+(f.updateTime?'（'+fmtTime(f.updateTime)+' 更新）':'');
    $('fdesc').textContent=[f.generalSituation,f.forecastDesc].filter(Boolean).join(' ')||'--';
    $('foutlook').textContent=f.outlook?'展望：'+f.outlook:'';
  }
  renderDays();
}

function renderAq(){
  const box=$('aq'),data=state.aq;
  if(!Array.isArray(data)||!data.length){box.hidden=true;return}
  let lat,lon;
  if(userPos){lat=userPos[0];lon=userPos[1]}
  else{const S=selectedStation(),p=COORD[state.enT[S.idx]]||COORD['Hong Kong Observatory'];lat=p[0];lon=p[1]}
  const have=data.map(x=>x.station);
  const n=nearestAq(lat,lon,have);
  if(!n){box.hidden=true;return}
  const row=data.find(x=>x.station===n.st.n);
  const v=row?aqVal(row.aqhi):NaN,lv=aqLevel(v);
  if(!lv){box.hidden=true;return}
  const m=/(\d+)-(\d+)-(\d+)T(\d+):(\d+)/.exec(row.publish_date||'');
  const tm=m?(+m[2])+'/'+(+m[3])+' '+m[4]+':'+m[5]:'';
  const dk=n.km<1?Math.round(n.km*1000)+' 米':n.km.toFixed(1)+' 公里';
  box.hidden=false;
  box.style.borderColor=lv.bg;
  box.style.background='linear-gradient(90deg,'+lv.bg+'66,rgba(255,255,255,.1))';
  box.innerHTML='<div class="aqn" style="background:'+lv.bg+';color:'+lv.fg+'">'+(v>10?'10+':v)+'</div><div class="aqt"><small>🌫️ 空氣質素健康指數 AQHI</small><b>健康風險：'+lv.zh+'</b><small>'+esc(n.st.z)+'監測站（距離'+(userPos?'你':'所選位置')+'約 '+dk+'）'+(tm?'・'+tm+' 更新':'')+'</small></div>';
}

function activeWarns(){
  const out=[],w=state.warn;
  if(w&&typeof w==='object'){
    for(const k in w){const x=w[k];if(x&&x.actionCode!=='CANCEL'){
      const code=x.code||k;const st=warnStyle(k==='WFIRE'?code:k,code);
      out.push({key:k,code,name:x.name||k,time:x.issueTime||x.updateTime,st})}}
  }
  if(!out.length&&state.cur&&state.cur.warningMessage){
    const m=state.cur.warningMessage;(Array.isArray(m)?m:[m]).filter(Boolean).forEach(t=>out.push({key:'?',code:'',name:t,time:'',st:warnStyle('?','')}));
  }
  return out.sort((a,b)=>b.st.rank-a.st.rank)
}
function renderWarn(){
  const items=activeWarns(),box=$('warns');
  box.innerHTML=items.length?items.map(x=>'<div class="banner'+(x.st.rank>=90?' sev':'')+'" role="alert" style="background:'+x.st.bg+';color:'+x.st.fg+'"><span class="ic">'+x.st.ic+'</span><div>'+esc(x.name)+(x.time?'<small>發出：'+esc(fmtTime(x.time))+'</small>':'')+'</div></div>').join(''):'<div class="ok">✅ 暫時冇生效中嘅天氣警告</div>';
}

function renderDays(){
  const n=state.fnd;
  if(!(n&&n.weatherForecast&&n.weatherForecast.length))return;
  const W=n.weatherForecast,R=rangeBars(W);
  const lbl=d=>{const s=String(d.forecastDate);return(+s.slice(4,6))+'月'+(+s.slice(6,8))+'日'};
  $('ext').innerHTML='<span class="c">🥶 最凍：'+lbl(W[R.coldIdx])+' '+R.lo+'°</span><span class="h">🥵 最熱：'+lbl(W[R.hotIdx])+' '+R.hi+'°</span>';
  $('lgl').textContent=R.lo+'°';$('lgh').textContent=R.hi+'°';
  $('days').innerHTML=W.map((d,i)=>{
    const b=R.bars[i];
    return '<div class="day"><div class="dt"><div class="ico">'+wxIcon(d.ForecastIcon)+'</div>'+
    '<div><div class="d1">'+lbl(d)+' '+esc(d.week)+(i===R.coldIdx?'<span class="badge c">最凍</span>':'')+(i===R.hotIdx?'<span class="badge h">最熱</span>':'')+'</div>'+
    '<div class="d2">'+esc(d.forecastWeather)+'</div>'+
    '<div class="d2">💧 降雨概率：'+esc(d.PSR||'--')+'</div></div>'+
    '<div class="tr">'+d.forecastMintemp.value+'–'+d.forecastMaxtemp.value+'°<small>濕度 '+d.forecastMinrh.value+'–'+d.forecastMaxrh.value+'%</small></div></div>'+
    '<div class="bar" title="'+R.lo+'°–'+R.hi+'° 範圍"><i style="left:'+b.l.toFixed(1)+'%;width:'+b.w.toFixed(1)+'%;background:linear-gradient(90deg,hsl('+b.c1+',90%,55%),hsl('+Math.round((b.c1+b.c2)/2)+',90%,52%),hsl('+b.c2+',90%,55%))"></i></div></div>';
  }).join('');
}

$('station').addEventListener('change',e=>{localStorage.setItem(KEY_ST,e.target.value);userPos=null;nearKm=null;render()});
$('refresh').addEventListener('click',load);
$('near').addEventListener('click',()=>{
  const b=$('near');
  if(!navigator.geolocation){alert('呢部機唔支援定位');return}
  if(!state.enT.length){alert('資料未載入完，請稍後再試');return}
  b.disabled=true;b.textContent='定位中…';
  navigator.geolocation.getCurrentPosition(p=>{
    b.disabled=false;b.textContent='📍 我附近';
    const lat=p.coords.latitude,lon=p.coords.longitude;
    const r=nearestStation(lat,lon,state.enT);
    if(!r){alert('搵唔到附近氣溫站');return}
    const S=selectedStation(),name=S.names[r.idx];
    if(!name){alert('搵唔到附近氣溫站');return}
    userPos=[lat,lon];nearKm=r.km;
    localStorage.setItem(KEY_ST,name);
    render();
  },err=>{
    b.disabled=false;b.textContent='📍 我附近';
    alert(err.code===1?'你拒絕咗定位權限。請喺瀏覽器／系統設定容許呢個網站使用位置。':err.code===3?'定位逾時，請到空曠啲嘅地方再試。':'暫時定唔到位，請稍後再試。');
  },{enableHighAccuracy:false,timeout:12000,maximumAge:300000});
});
setInterval(load,REFRESH);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastOk>REFRESH)load()});

try{const s=JSON.parse(localStorage.getItem(KEY_DATA)||'null');if(s){state=Object.assign(state,s.state);lastOk=s.lastOk;render()}}catch(e){}
load();

let dp=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('install').style.display='block'});
$('install').addEventListener('click',async()=>{if(dp){dp.prompt();await dp.userChoice;dp=null;$('install').style.display='none'}});
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!navigator.standalone;
if(ios){$('install').style.display='block';$('install').textContent='📲 Safari：㩒分享 →「加入主畫面」';$('install').onclick=null}
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
</script>
