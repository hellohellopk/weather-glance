<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>天氣一眼睇</title>
<meta name="theme-color" content="#0b66c3">
<meta name="description" content="香港天文台開放數據天氣App">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="天氣一眼睇">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#eaf3fc;--card:#fff;--ink:#14243a;--sub:#5b6b80;--pri:#0b66c3;--warn:#c62828;--warnbg:#fdecea;--track:rgba(128,128,128,.22)}
@media(prefers-color-scheme:dark){:root{--bg:#0d1722;--card:#17283a;--ink:#eef4fb;--sub:#9db0c6;--pri:#5aa9f5;--warn:#ff8a80;--warnbg:#3a1d1d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 -apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans HK","Microsoft JhengHei",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:12px}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 4px}
h1{font-size:24px;margin:0}
button{font:inherit;border:0;border-radius:12px;background:var(--pri);color:#fff;padding:10px 16px;min-height:44px}
button:disabled{opacity:.6}
.card{background:var(--card);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.hero{display:flex;align-items:center;justify-content:space-between}
.temp{font-size:72px;font-weight:700;line-height:1}
.temp small{font-size:32px}
.hero img{width:96px;height:96px}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}
select{font:inherit;font-size:20px;flex:1;min-width:0;min-height:48px;padding:8px 12px;border-radius:12px;border:2px solid var(--pri);background:var(--card);color:var(--ink)}
#near{white-space:nowrap;min-height:48px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:var(--bg);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:28px}
.stat span{color:var(--sub);font-size:15px}
.banner{border-radius:18px;padding:16px 18px;margin:10px 0;font-weight:800;font-size:24px;line-height:1.3;display:flex;gap:12px;align-items:center;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.banner .ic{font-size:40px;line-height:1}
.banner small{display:block;font-size:14px;font-weight:500;opacity:.9;margin-top:2px}
.banner.sev{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.015);box-shadow:0 0 0 6px rgba(198,40,40,.25)}}
@media(prefers-reduced-motion:reduce){.banner.sev{animation:none}}
.ok{color:var(--sub);margin-top:8px;font-size:16px}
.tip{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--track)}
.tip:first-of-type{border-top:0}
.tip .ic{font-size:30px;line-height:1.2}
.tip b{font-size:20px;display:block}
.tip span{color:var(--sub);font-size:15px}
.tip.lv3 b{color:var(--warn)}
h2{font-size:21px;margin:0 0 8px}
.sub{color:var(--sub);font-size:16px}
.priv{color:var(--sub);font-size:13px}
.ext{display:flex;justify-content:space-between;gap:8px;margin:2px 0 8px;font-size:16px;font-weight:700}
.ext span{flex:1;border-radius:12px;padding:8px 10px;background:var(--bg)}
.ext .c{color:#1e7fd8}.ext .h{color:#e64a19}
.day{padding:12px 0;border-top:1px solid var(--track)}
.day:first-of-type{border-top:0}
.dt{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center}
.dt img{width:48px;height:48px}
.d1{font-weight:700}
.d2{font-size:15px;color:var(--sub)}
.tr{font-size:22px;font-weight:700;text-align:right;white-space:nowrap}
.tr small{display:block;font-size:14px;font-weight:400;color:var(--sub)}
.bar{position:relative;height:12px;border-radius:6px;background:var(--track);margin:10px 0 2px 62px}
.bar i{position:absolute;top:0;bottom:0;border-radius:6px;min-width:8px}
.badge{display:inline-block;font-size:13px;font-weight:700;border-radius:8px;padding:0 6px;margin-left:6px;color:#fff;vertical-align:middle}
.badge.c{background:#1e7fd8}.badge.h{background:#e64a19}
.err{background:var(--warnbg);color:var(--warn);padding:10px 14px;border-radius:12px;display:none;margin:8px 0}
footer{text-align:center;color:var(--sub);font-size:14px;padding:16px 8px 28px}
footer a{color:var(--pri)}
#install{display:none;width:100%;margin-top:8px}
p{margin:6px 0}
</style>
</head>
<body>
<div class="wrap">
<header><h1>🌤️ 天氣一眼睇</h1><button id="refresh" aria-label="重新整理">↻ 更新</button></header>
<div id="err" class="err"></div>
<div id="warns" aria-live="polite"></div>

<section class="card">
<h2>🚪 出門口小貼士</h2>
<div id="tips"><div class="sub">載入中…</div></div>
</section>

<section class="card" id="now">
<div class="hero"><div><div class="temp"><span id="t">--</span><small>°C</small></div><div class="sub" id="place">載入中…</div><div class="sub" id="dist"></div></div><img id="icon" alt="" hidden></div>
<div class="row"><select id="station" aria-label="揀氣溫站"></select><button id="near">📍 我附近</button></div>
<div class="priv">🔒 位置只喺你部手機度計算，唔會上傳或儲存。</div>
<div class="stats">
<div class="stat"><span>相對濕度</span><b id="rh">--</b></div>
<div class="stat"><span>紫外線指數</span><b id="uv">--</b></div>
</div>
<div class="sub" id="upd" style="margin-top:10px"></div>
<button id="install">📲 加到主畫面</button>
</section>

<section class="card">
<h2>今日本港天氣預報</h2>
<div class="sub" id="fper"></div>
<p id="fdesc">--</p>
<p class="sub" id="foutlook"></p>
</section>

<section class="card">
<h2>未來九天預報</h2>
<div class="ext" id="ext"></div>
<div id="days"></div>
</section>

<footer>資料來源：<a href="https://www.hko.gov.hk" target="_blank" rel="noopener">香港天文台</a>（<a href="https://data.weather.gov.hk/weatherAPI/doc/HKO_Open_Data_API_Documentation_tc.pdf" target="_blank" rel="noopener">開放數據 API</a>）<br>每 10 分鐘自動更新 · 只供參考，以天文台公佈為準</footer>
</div>
<script>
const COORD={"King's Park":[22.31194,114.17278],"Hong Kong Observatory":[22.30194,114.17417],"Wong Chuk Hang":[22.24778,114.17361],"Ta Kwu Ling":[22.52861,114.15667],"Lau Fau Shan":[22.46889,113.98361],"Tai Po":[22.44833,114.17722],"Sha Tin":[22.4025,114.21],"Tuen Mun":[22.38583,113.96417],"Tseung Kwan O":[22.31583,114.25556],"Sai Kung":[22.37556,114.27444],"Cheung Chau":[22.20111,114.02667],"Chek Lap Kok":[22.30944,113.92194],"Tsing Yi":[22.34417,114.11],"Shek Kong":[22.43611,114.08472],"Tsuen Wan Ho Koon":[22.38361,114.10778],"Tsuen Wan Shing Mun Valley":[22.37556,114.12667],"Hong Kong Park":[22.27833,114.16222],"Shau Kei Wan":[22.28167,114.23611],"Kowloon City":[22.335,114.18472],"Happy Valley":[22.27056,114.18361],"Wong Tai Sin":[22.33944,114.20528],"Stanley":[22.21417,114.21861],"Kwun Tong":[22.31861,114.22472],"Sham Shui Po":[22.33583,114.13694],"Kai Tak Runway Park":[22.305,114.21694],"Yuen Long Park":[22.44083,114.01833],"Tai Mei Tuk":[22.47528,114.2375],"Sheung Shui":[22.50194,114.11111],"Tap Mun":[22.47139,114.36056],"Tate's Cairn":[22.35778,114.21778],"Tai Mo Shan":[22.41056,114.12444],"Ngong Ping":[22.25861,113.91278],"The Peak":[22.26417,114.155],"Wetland Park":[22.46667,114.00889],"Peng Chau":[22.29111,114.04333],"Waglan Island":[22.18222,114.30333],"Ping Chau":[22.54667,114.42833],"Kat O":[22.53639,114.30194],"Lamma Island":[22.22611,114.10861],"Sha Lo Wan":[22.29111,113.90694],"Clear Water Bay":[22.26333,114.29972],"Kau Sai Chau":[22.37028,114.3125],"Tai Lung":[22.48472,114.1175],"Pak Tam Chung":[22.40278,114.32306],"Hong Kong International Airport":[22.30944,113.92194],"Kadoorie Farm and Botanic Garden":[22.43278,114.12083],"Tuen Mun Children and Juvenile Home":[22.38583,113.96417],"Nei Lak Shan":[22.26333,113.91111]};
const DIST={"Central & Western District":[22.2825,114.145],"Eastern District":[22.28,114.22],"Kwai Tsing":[22.356,114.125],"Islands District":[22.26,113.95],"North District":[22.5,114.15],"Sai Kung":[22.38,114.27],"Sha Tin":[22.38,114.19],"Southern District":[22.245,114.17],"Tai Po":[22.45,114.17],"Tsuen Wan":[22.37,114.12],"Tuen Mun":[22.39,113.975],"Wan Chai":[22.275,114.175],"Yuen Long":[22.445,114.035],"Yau Tsim Mong":[22.31,114.17],"Sham Shui Po":[22.33,114.16],"Kowloon City":[22.328,114.19],"Wong Tai Sin":[22.342,114.2],"Kwun Tong":[22.312,114.225]};
function hav(a,b,c,d){const R=6371,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b);
  const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function nearestStation(lat,lon,enNames){let best=-1,bd=1e9;
  enNames.forEach((n,i)=>{const p=COORD[n];if(!p)return;const d=hav(lat,lon,p[0],p[1]);if(d<bd){bd=d;best=i}});
  return best<0?null:{idx:best,km:bd}}
function nearestDistrict(lat,lon,enNames){let best=-1,bd=1e9;
  enNames.forEach((n,i)=>{const p=DIST[n];if(!p)return;const d=hav(lat,lon,p[0],p[1]);if(d<bd){bd=d;best=i}});
  return best<0?null:{idx:best,km:bd}}
const PSR_LV={'低':0,'中低':1,'中':2,'中高':3,'高':3};
function tipUmbrella(psr,rainMm,place,rainWarn){
  let lv=PSR_LV[psr]??0,why=[];
  if(rainWarn){lv=3;why.push('有暴雨警告生效')}
  if(rainMm>=1){lv=3}else if(rainMm>0){lv=Math.max(lv,2)}
  const head=['😎 唔使帶遮','🌂 遮可帶可唔帶','🌂 帶把遮備用較穩陣','☔ 要帶遮！'][lv];
  const rainTxt=(place?place+'過去一小時雨量：':'過去一小時雨量：')+(rainMm==null?'未有數據':rainMm+' 毫米');
  return{lv,icon:lv>=3?'☔':lv==2?'🌂':'😎',head:head.replace(/^\S+\s/,''),
    line:'今日降雨概率：'+(psr||'未有')+'．'+rainTxt+(why.length?'．'+why.join('、'):'')}}
function tipClothes(mn){
  if(mn==null||isNaN(mn))return null;
  let n,t,ic='👕';
  if(mn>=28){n='1 件';t='短袖輕薄衫就夠'}
  else if(mn>=24){n='1 件';t='短袖，冷氣房可帶件薄外套'}
  else if(mn>=20){n='2 件';t='短袖＋薄外套或襯衫'}
  else if(mn>=16){n='2–3 件';t='長袖衫＋外套';ic='🧥'}
  else if(mn>=12){n='3 件';t='衛衣或毛衣＋外套';ic='🧥'}
  else if(mn>=8){n='3–4 件';t='內層＋毛衣＋厚外套';ic='🧥'}
  else{n='4–5 件';t='保暖內衣＋毛衣＋大褸，加頸巾手套';ic='🧣'}
  return{icon:ic,head:'著 '+n,line:'今日最低氣溫 '+mn+'°C：'+t}}
function tipUV(v,desc){
  if(v==null||isNaN(v))return null;
  if(v>=6)return{lv:3,icon:'🧴',head:'要防曬！',line:'紫外線指數 '+v+(desc?'（'+desc+'）':'')+'：搽防曬、戴帽同太陽眼鏡'};
  if(v>=3)return{lv:1,icon:'🧴',head:'建議防曬',line:'紫外線指數 '+v+(desc?'（'+desc+'）':'')+'：長時間喺戶外記得搽防曬'};
  return null}
function warnStyle(key,code){
  const S=(bg,fg,ic,rank)=>({bg,fg,ic,rank});
  if(key==='WRAIN'){
    if(code==='WRAINB')return S('#111','#fff','⬛☔',80);
    if(code==='WRAINR')return S('#d32f2f','#fff','🟥☔',60);
    return S('#ffd600','#3a2f00','🟨☔',40)}
  if(key==='WTCSGNL'){
    if(code==='TC10')return S('#000','#fff','🌀',100);
    if(code==='TC9')return S('#8e0000','#fff','🌀',95);
    if(/^TC8/.test(code))return S('#c62828','#fff','🌀',90);
    if(code==='TC3')return S('#ef6c00','#fff','🌀',50);
    return S('#546e7a','#fff','🌀',30)}
  if(key==='WCOLD')return S('#1565c0','#fff','🥶',45);
  if(key==='WHOT')return S('#e64a19','#fff','🥵',45);
  if(key==='WMSGNL')return S('#00838f','#fff','🌬️',35);
  if(key==='WFIRE'||key==='WFIREY'||key==='WFIRER')return code==='WFIRER'||key==='WFIRER'?S('#c62828','#fff','🔥',55):S('#fbc02d','#3a2f00','🔥',30);
  if(key==='WL')return S('#6d4c41','#fff','⛰️',40);
  if(key==='WTS')return S('#6a1b9a','#fff','⛈️',35);
  if(key==='WFNTSA')return S('#00695c','#fff','🌊',35);
  if(key==='WTMW')return S('#b71c1c','#fff','🌊',70);
  return S('#455a64','#fff','⚠️',20)}
function tempHue(t){const x=Math.max(8,Math.min(32,t));return Math.round(210-(x-8)/24*210)}
function rangeBars(days){
  const mins=days.map(d=>+d.forecastMintemp.value),maxs=days.map(d=>+d.forecastMaxtemp.value);
  const lo=Math.min(...mins),hi=Math.max(...maxs),span=Math.max(1,hi-lo);
  return{lo,hi,coldIdx:mins.indexOf(lo),hotIdx:maxs.indexOf(hi),
    bars:days.map((d,i)=>({l:(mins[i]-lo)/span*100,w:(maxs[i]-mins[i])/span*100,c1:tempHue(mins[i]),c2:tempHue(maxs[i])}))}}
const API='https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=';
const ICON=n=>'https://www.hko.gov.hk/images/HKOWxIconOutline/pic'+n+'.png';
const $=id=>document.getElementById(id);
const KEY_ST='wx_station',KEY_DATA='wx_cache2',REFRESH=10*60*1000;
let state={cur:null,flw:null,fnd:null,warn:null,enT:[],enR:[]},lastOk=0,loading=false;
let userPos=null,nearKm=null;

async function get(t,lang){
  const c=new AbortController(),to=setTimeout(()=>c.abort(),15000);
  try{const r=await fetch(API+t+'&lang='+(lang||'tc')+'&_='+Math.floor(Date.now()/60000),{signal:c.signal});
    if(!r.ok)throw new Error(t+' HTTP '+r.status);return await r.json();}
  finally{clearTimeout(to)}
}
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

async function load(){
  if(loading)return;loading=true;$('refresh').textContent='… 更新中';
  const jobs=[get('rhrread'),get('flw'),get('fnd'),get('warnsum'),get('rhrread','en')];
  const res=await Promise.allSettled(jobs);
  let fails=0;
  ['cur','flw','fnd','warn'].forEach((k,i)=>{if(res[i].status==='fulfilled')state[k]=res[i].value;else fails++});
  if(res[4].status==='fulfilled'){const e=res[4].value;
    state.enT=((e.temperature&&e.temperature.data)||[]).map(x=>x.place);
    state.enR=((e.rainfall&&e.rainfall.data)||[]).map(x=>x.place)}
  if(fails<4){lastOk=Date.now();try{localStorage.setItem(KEY_DATA,JSON.stringify({state,lastOk}))}catch(e){}}
  const e=$('err');
  if(fails){e.style.display='block';e.textContent=fails===4?'連唔到天文台，顯示上次資料。':'部分資料更新失敗，已顯示可用資料。'}
  else e.style.display='none';
  render();loading=false;$('refresh').textContent='↻ 更新';
}

function fmtTime(s){if(!s)return'';const d=new Date(s);if(isNaN(d))return'';
  return d.toLocaleString('zh-HK',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Hong_Kong'})}

function selectedStation(){
  const temps=(state.cur&&state.cur.temperature&&state.cur.temperature.data)||[];
  const names=temps.map(x=>x.place);
  const saved=localStorage.getItem(KEY_ST)||'香港天文台';
  const cur=names.includes(saved)?saved:(names.includes('香港天文台')?'香港天文台':names[0]);
  return{temps,names,cur,idx:names.indexOf(cur)}
}

function render(){
  const c=state.cur;
  if(c){
    const S=selectedStation(),sel=$('station');
    if(sel.options.length!==S.names.length||S.names.some((n,i)=>sel.options[i].value!==n)){
      sel.innerHTML=S.names.map(n=>'<option value="'+esc(n)+'">'+esc(n)+'</option>').join('');
    }
    sel.value=S.cur;
    const row=S.temps[S.idx];
    $('t').textContent=row?row.value:'--';
    $('place').textContent=S.cur+'．現時氣溫';
    $('dist').textContent=nearKm!=null?'📍 距離你約 '+(nearKm<1?Math.round(nearKm*1000)+' 米':nearKm.toFixed(1)+' 公里'):'';
    const hd=(c.humidity&&c.humidity.data)||[];
    const h=hd.find(x=>x.place===S.cur)||hd[0];
    $('rh').textContent=h?h.value+'%':'--';
    const uvd=c.uvindex&&c.uvindex.data;
    $('uv').textContent=uvd&&uvd.length?uvd[0].value+'（'+uvd[0].desc+'）':'夜間／未有';
    const ic=c.icon&&c.icon[0];
    if(ic){$('icon').src=ICON(ic);$('icon').hidden=false}
    $('upd').textContent='氣溫記錄：'+fmtTime(c.temperature&&c.temperature.recordTime)+'　更新：'+fmtTime(lastOk?new Date(lastOk).toISOString():c.updateTime);
  }
  renderWarn();renderTips();
  const f=state.flw;
  if(f){
    $('fper').textContent=(f.forecastPeriod||'')+(f.updateTime?'（'+fmtTime(f.updateTime)+' 更新）':'');
    $('fdesc').textContent=[f.generalSituation,f.forecastDesc].filter(Boolean).join(' ')||'--';
    $('foutlook').textContent=f.outlook?'展望：'+f.outlook:'';
  }
  renderDays();
}

function activeWarns(){
  const out=[],w=state.warn;
  if(w&&typeof w==='object'){
    for(const k in w){const x=w[k];if(x&&x.actionCode!=='CANCEL'){
      const code=x.code||k;const st=warnStyle(k==='WFIRE'?code:k,code);
      out.push({key:k,code,name:x.name||k,time:x.issueTime||x.updateTime,st})}}
  }
  if(!out.length&&state.cur&&state.cur.warningMessage){
    const m=state.cur.warningMessage;(Array.isArray(m)?m:[m]).filter(Boolean).forEach(t=>out.push({key:'?',code:'',name:t,time:'',st:warnStyle('?','')}));
  }
  return out.sort((a,b)=>b.st.rank-a.st.rank)
}
function renderWarn(){
  const items=activeWarns(),box=$('warns');
  box.innerHTML=items.length?items.map(x=>'<div class="banner'+(x.st.rank>=90?' sev':'')+'" role="alert" style="background:'+x.st.bg+';color:'+x.st.fg+'"><span class="ic">'+x.st.ic+'</span><div>'+esc(x.name)+(x.time?'<small>發出：'+esc(fmtTime(x.time))+'</small>':'')+'</div></div>').join(''):'<div class="ok">✅ 暫時冇生效中嘅天氣警告</div>';
}

function rainNear(){
  const c=state.cur,rd=(c&&c.rainfall&&c.rainfall.data)||[];
  if(!rd.length||!state.enR.length)return{mm:null,place:''};
  let lat,lon;
  if(userPos){lat=userPos[0];lon=userPos[1]}
  else{const S=selectedStation(),p=COORD[state.enT[S.idx]];if(!p)return{mm:null,place:''};lat=p[0];lon=p[1]}
  const n=nearestDistrict(lat,lon,state.enR);
  if(!n||!rd[n.idx])return{mm:null,place:''};
  const v=rd[n.idx].max;
  return{mm:v==null?0:Number(v),place:rd[n.idx].place}
}
function renderTips(){
  const box=$('tips'),f=state.fnd,c=state.cur;
  if(!f&&!c){return}
  const d0=f&&f.weatherForecast&&f.weatherForecast[0];
  const rw=activeWarns().some(x=>x.key==='WRAIN');
  const r=rainNear();
  const items=[];
  const u=tipUmbrella(d0&&d0.PSR,r.mm,r.place,rw);
  items.push({lv:u.lv,icon:u.icon,head:u.head,line:u.line});
  const cl=tipClothes(d0?Number(d0.forecastMintemp.value):null);
  if(cl)items.push(cl);
  const uvd=c&&c.uvindex&&c.uvindex.data;
  const uv=tipUV(uvd&&uvd.length?Number(uvd[0].value):null,uvd&&uvd.length?uvd[0].desc:'');
  if(uv)items.push(uv);
  box.innerHTML=items.map(x=>'<div class="tip lv'+(x.lv||0)+'"><span class="ic">'+x.icon+'</span><div><b>'+esc(x.head)+'</b><span>'+esc(x.line)+'</span></div></div>').join('');
}

function renderDays(){
  const n=state.fnd;
  if(!(n&&n.weatherForecast&&n.weatherForecast.length))return;
  const W=n.weatherForecast,R=rangeBars(W);
  const lbl=d=>{const s=String(d.forecastDate);return(+s.slice(4,6))+'月'+(+s.slice(6,8))+'日'};
  $('ext').innerHTML='<span class="c">🥶 最凍：'+lbl(W[R.coldIdx])+' '+R.lo+'°</span><span class="h">🥵 最熱：'+lbl(W[R.hotIdx])+' '+R.hi+'°</span>';
  $('days').innerHTML=W.map((d,i)=>{
    const b=R.bars[i];
    return '<div class="day"><div class="dt"><img src="'+ICON(d.ForecastIcon)+'" alt="" loading="lazy">'+
    '<div><div class="d1">'+lbl(d)+' '+esc(d.week)+(i===R.coldIdx?'<span class="badge c">最凍</span>':'')+(i===R.hotIdx?'<span class="badge h">最熱</span>':'')+'</div>'+
    '<div class="d2">'+esc(d.forecastWeather)+'</div>'+
    '<div class="d2">💧 降雨概率：'+esc(d.PSR||'--')+'</div></div>'+
    '<div class="tr">'+d.forecastMintemp.value+'–'+d.forecastMaxtemp.value+'°<small>濕度 '+d.forecastMinrh.value+'–'+d.forecastMaxrh.value+'%</small></div></div>'+
    '<div class="bar" title="'+R.lo+'°–'+R.hi+'° 範圍"><i style="left:'+b.l.toFixed(1)+'%;width:'+b.w.toFixed(1)+'%;background:linear-gradient(90deg,hsl('+b.c1+',85%,52%),hsl('+b.c2+',85%,52%))"></i></div></div>';
  }).join('');
}

$('station').addEventListener('change',e=>{localStorage.setItem(KEY_ST,e.target.value);userPos=null;nearKm=null;render()});
$('refresh').addEventListener('click',load);
$('near').addEventListener('click',()=>{
  const b=$('near');
  if(!navigator.geolocation){alert('呢部機唔支援定位');return}
  if(!state.enT.length){alert('資料未載入完，請稍後再試');return}
  b.disabled=true;b.textContent='定位中…';
  navigator.geolocation.getCurrentPosition(p=>{
    b.disabled=false;b.textContent='📍 我附近';
    const lat=p.coords.latitude,lon=p.coords.longitude;
    const r=nearestStation(lat,lon,state.enT);
    if(!r){alert('搵唔到附近氣溫站');return}
    const S=selectedStation(),name=S.names[r.idx];
    if(!name){alert('搵唔到附近氣溫站');return}
    userPos=[lat,lon];nearKm=r.km;
    localStorage.setItem(KEY_ST,name);
    render();
  },err=>{
    b.disabled=false;b.textContent='📍 我附近';
    alert(err.code===1?'你拒絕咗定位權限。請喺瀏覽器／系統設定容許呢個網站使用位置。':err.code===3?'定位逾時，請到空曠啲嘅地方再試。':'暫時定唔到位，請稍後再試。');
  },{enableHighAccuracy:false,timeout:12000,maximumAge:300000});
});
setInterval(load,REFRESH);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastOk>REFRESH)load()});

try{const s=JSON.parse(localStorage.getItem(KEY_DATA)||'null');if(s){state=Object.assign(state,s.state);lastOk=s.lastOk;render()}}catch(e){}
load();

let dp=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('install').style.display='block'});
$('install').addEventListener('click',async()=>{if(dp){dp.prompt();await dp.userChoice;dp=null;$('install').style.display='none'}});
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!navigator.standalone;
if(ios){$('install').style.display='block';$('install').textContent='📲 Safari：㩒分享 →「加入主畫面」';$('install').onclick=null}
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
</script>
</body>
